    - maestro
  scope: app
  status: active
  origin: system
  reviewState: approved
  sourceType: agent
  lifecycle:
    state: sandbox
    version: 1
  limits:
    rateLimit: 100
    costLimit: 1.0
    executionTimeout: 30000

