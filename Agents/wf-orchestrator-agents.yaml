- key: planner
  name: "WF-Orchestrator — Planner"
  catalogName: wf.orchestrator.planner
  entryType: agent
  roleClass: assistant
  category: orchestration
  subCategory: workflow
  description: "Plans workflow step sequences and dependencies for execution."
  systemPrompt: >
    You are a Planner agent in the WF-Orchestrator crew.
    Your role is to analyze a workflow goal and break it into a sequence
    of executable steps with clear dependencies.
    Consider parallel execution opportunities, resource constraints,
    and failure recovery paths.
    Output a structured plan with step names, descriptions, dependencies,
    and estimated complexity.
  modelId: gpt-4o
  temperature: 0.5
  hasDocumentAccess: false
  hasToolAccess: false
  allowedTools: []
  callable: true
  capabilities:
    - planning
    - dependency-analysis
  tags:
