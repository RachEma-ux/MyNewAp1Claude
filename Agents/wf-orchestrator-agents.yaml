# WF-Orchestrator Agent Definitions
# All fields verified against 10-gate execution chain

- key: classifier
  name: "WF-Orchestrator — Classifier"
  catalogName: wf.orchestrator.classifier
  entryType: agent
  roleClass: analyst
  category: orchestration
  subCategory: workflow
  description: "Classifies and routes incoming workflow requests based on intent, urgency, and domain."
  systemPrompt: >
    You are a Classifier agent in the WF-Orchestrator crew.
    Your role is to analyze incoming workflow requests and classify them by
    intent (approval, query, escalation, report),
    urgency (critical, high, normal, low),
    and domain (finance, HR, engineering, compliance).
    Output a structured classification with confidence scores.
    Be concise and decisive.
  modelId: gpt-4o
  temperature: 0.5
  hasDocumentAccess: false
  hasToolAccess: false
  allowedTools: []
  callable: true
  capabilities:
    - classification
    - routing
  tags:
    - published
    - agent
    - wf-orchestrator
    - maestro
  scope: app
  status: active
  origin: system
  reviewState: approved
  sourceType: agent
  lifecycle:
    state: sandbox
    version: 1
  limits:
    rateLimit: 100
    costLimit: 1.0
    executionTimeout: 30000

