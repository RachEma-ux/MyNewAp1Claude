<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a5b4fc"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Neural network nodes -->
  <circle cx="256" cy="140" r="28" fill="url(#glow)" opacity="0.9"/>
  <circle cx="150" cy="256" r="24" fill="url(#glow)" opacity="0.8"/>
  <circle cx="362" cy="256" r="24" fill="url(#glow)" opacity="0.8"/>
  <circle cx="190" cy="370" r="22" fill="url(#glow)" opacity="0.7"/>
  <circle cx="322" cy="370" r="22" fill="url(#glow)" opacity="0.7"/>
  <!-- Connections -->
  <line x1="256" y1="168" x2="150" y2="232" stroke="#e0e7ff" stroke-width="3" opacity="0.5"/>
  <line x1="256" y1="168" x2="362" y2="232" stroke="#e0e7ff" stroke-width="3" opacity="0.5"/>
  <line x1="150" y1="280" x2="190" y2="348" stroke="#e0e7ff" stroke-width="3" opacity="0.5"/>
  <line x1="362" y1="280" x2="322" y2="348" stroke="#e0e7ff" stroke-width="3" opacity="0.5"/>
  <line x1="150" y1="280" x2="322" y2="348" stroke="#e0e7ff" stroke-width="2" opacity="0.3"/>
  <line x1="362" y1="280" x2="190" y2="348" stroke="#e0e7ff" stroke-width="2" opacity="0.3"/>
  <!-- Center hub -->
  <circle cx="256" cy="265" r="42" fill="none" stroke="#e0e7ff" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="265" r="18" fill="#fff" opacity="0.95"/>
