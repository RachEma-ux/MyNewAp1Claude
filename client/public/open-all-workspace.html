<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace Pages Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #1a1a2e; color: #e0e0e0; }
    h1 { color: #fff; }
    ul { list-style: none; padding: 0; }
    li { margin: 8px 0; }
    a { color: #7cb3ff; text-decoration: none; font-size: 16px; }
    a:hover { text-decoration: underline; }
    button { margin: 20px 0; padding: 12px 24px; font-size: 16px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #2563eb; }
    p.note { color: #aaa; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Workspace Pages Test</h1>
  <p class="note">Allow popups for this page if your browser blocks them, then reload.</p>
  <button id="openAll">Open All</button>
  <ul id="links"></ul>
  <script>
    var pages = [
      '/w/2',
      '/w/2/projects',
      '/w/2/projects/board',
      '/w/2/projects/timeline',
      '/w/2/knowledge',
      '/w/2/knowledge/decisions',
      '/w/2/knowledge/search',
      '/w/2/agents',
      '/w/2/agents/runs',
      '/w/2/collaboration',
      '/w/2/reports',
      '/w/2/governance'
    ];

    var ul = document.getElementById('links');
    pages.forEach(function(p) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = p;
      a.target = '_blank';
      a.textContent = p;
      li.appendChild(a);
      ul.appendChild(li);
    });

    document.getElementById('openAll').addEventListener('click', function() {
      pages.forEach(function(p) { window.open(p, '_blank'); });
    });
  </script>
</body>
</html>
