<!DOCTYPE html>
<html><head><title>All App Pages (localhost)</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; padding: 1.5rem; }
  h2 { text-align: center; margin-bottom: 0.5rem; }
  p.sub { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.5rem; }
  .grid a {
    display: block; padding: 0.75rem 1rem; background: #1e293b; border: 1px solid #334155;
    border-radius: 8px; color: #60a5fa; text-decoration: none; font-size: 0.9rem;
    transition: background 0.15s, border-color 0.15s;
  }
  .grid a:hover, .grid a:active { background: #2563eb; border-color: #3b82f6; color: #fff; }
  .section { margin-bottom: 1.5rem; }
  .section h3 { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<h2>All App Pages — localhost (29)</h2>
<p class="sub">Tap any link to open. Long-press to open in new tab.</p>

<div class="section">
  <h3>Core</h3>
  <div class="grid" id="core"></div>
</div>
<div class="section">
  <h3>LLM & Models</h3>
  <div class="grid" id="llm"></div>
</div>
<div class="section">
  <h3>Agents & Automation</h3>
  <div class="grid" id="agents"></div>
</div>
<div class="section">
  <h3>Documents & Knowledge</h3>
  <div class="grid" id="docs"></div>
</div>
<div class="section">
  <h3>Governance & Ops</h3>
  <div class="grid" id="gov"></div>
</div>
<div class="section">
  <h3>Dev Tools</h3>
  <div class="grid" id="dev"></div>
</div>

<script>
const sections = {
  core: [
    ["/", "Home"],
    ["/chat", "Chat"],
    ["/settings", "Settings"],
    ["/analytics", "Analytics"],
  ],
  llm: [
    ["/providers", "Providers"],
    ["/llm", "LLM Overview"],
    ["/llm/catalogue", "Catalogue"],
    ["/llm/catalogue/manage", "Manage Catalogue"],
    ["/llm/control-plane", "Control Plane"],
    ["/llm/promotions", "Promotions"],
    ["/models", "Models"],
    ["/embeddings", "Embeddings"],
    ["/vectordb", "Vector DB"],
  ],
  agents: [
    ["/agents", "Agents"],
    ["/agents/dashboard", "Agents Dashboard"],
    ["/automation", "Automation"],
    ["/conversations", "Conversations"],
    ["/wcp/workflows", "WCP Workflows"],
  ],
  docs: [
    ["/documents", "Documents"],
    ["/wiki", "Wiki"],
    ["/resources", "Resources"],
  ],
  gov: [
    ["/policies", "Policies"],
    ["/governance/agents", "Governance Agents"],
    ["/protocols", "Protocols"],
    ["/tools-management", "Tools Mgmt"],
    ["/compliance-export", "Compliance Export"],
    ["/drift-detection", "Drift Detection"],
    ["/deploy", "Deploy"],
  ],
  dev: [
    ["/ui-showcase", "UI Showcase"],
  ],
};
const base = window.location.origin;
Object.entries(sections).forEach(([id, pages]) => {
  const el = document.getElementById(id);
  el.innerHTML = pages.map(([path, label]) =>
    '<a href="' + base + path + '" target="_blank">' + label + ' <small style="color:#64748b">' + path + '</small></a>'
  ).join("");
});
</script>
</body></html>
