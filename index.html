<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Agent.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink-950:#131426; --ink-900:#1A1B2E; --ink-800:#22243B; --ink-700:#2D2F4A;
  --cream:#F4F3F8; --white:#FFFFFF; --hairline:#ECECF1; --hairline-2:#E1E1EA;
  --text-950:#0F1024; --text-900:#1A1B2E; --text-700:#4A4B63; --text-500:#8A8B9F;
  --text-400:#B4B5C5; --text-on-dark:#E8E8F0; --text-on-dark-dim:#8E90A8;
  --lime:#D7FE4F; --lime-deep:#BBE93A; --purple:#7C6BF4; --purple-soft:#A99CFF; --purple-bg:#EDEAFE;
  --c-green:#6BD68A; --c-purple:#7C6BF4; --c-teal:#4DD0C7; --c-violet:#9B6BE0;
  --c-coral:#F26B6B; --c-amber:#F0A23A; --c-blue:#5B8FF9; --c-pink:#EE7CB8;
  --radius-card:22px; --radius-lg:18px; --radius-md:14px; --radius-pill:999px;
  --shadow-card:0 1px 2px rgba(20,21,42,.04),0 8px 24px rgba(20,21,42,.04);
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body {
  font-family:'Geist',system-ui,-apple-system,sans-serif;
  background:radial-gradient(ellipse at 0% 50%,rgba(124,107,244,.18),transparent 40%),linear-gradient(180deg,#0E0F22 0%,#15162B 100%);
  color:var(--text-900); min-height:100vh; padding:18px;
  -webkit-font-smoothing:antialiased; touch-action:manipulation;
}
button { font-family:inherit; cursor:pointer; border:0; background:transparent; color:inherit; }
input, textarea, select { font-family:inherit; }

.app { display:grid; grid-template-columns:56px 264px 1fr 360px; background:var(--ink-900);
  border-radius:28px; overflow:hidden; min-height:calc(100vh - 36px);
  box-shadow:0 30px 80px rgba(0,0,0,.4); position:relative; }
.app.is-sidebar-collapsed { grid-template-columns:56px 1fr 360px; }
.app.is-sidebar-collapsed > .sidebar { display:none !important; }

/* RAIL */
.rail { background:var(--ink-950); display:flex; flex-direction:column; align-items:center;
  padding:14px 0 16px; gap:4px; border-right:1px solid rgba(255,255,255,.04); }
.rail-logo { width:42px; min-height:46px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:1px; padding:4px 0; margin-bottom:8px;
  border:0; background:transparent; cursor:pointer; border-radius:10px;
  transition:background .18s; }
.rail-logo:hover { background:rgba(215,254,79,.08); }
.rail-logo:active { transform:scale(.95); }
.rail-logo-text { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:21px;
  color:var(--lime); letter-spacing:-0.04em; line-height:1; }
.rail-logo-chev { width:10px; height:10px; color:rgba(215,254,79,.55);
  transition:transform .25s; }
.app:not(.is-sidebar-collapsed) .rail-logo-chev { transform:rotate(180deg); }
.rail-btn { width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
  color:var(--text-on-dark-dim); transition:all .2s; border:0; background:transparent; cursor:pointer; }
.rail-btn:hover { color:var(--text-on-dark); background:rgba(255,255,255,.04); }
.rail-btn.is-active { color:var(--purple-soft); background:rgba(124,107,244,.1); }
.rail-spacer { flex:1; }
.rail-bottom { display:flex; flex-direction:column; align-items:center; gap:6px; }
.rail-avatar-btn { width:38px; height:38px; border-radius:11px; border:0; padding:0;
  cursor:pointer; overflow:hidden; position:relative; background:transparent; }
.rail-avatar-btn svg { width:100%; height:100%; display:block; }
.rail-avatar-btn .status-dot { position:absolute; bottom:1px; right:1px; width:9px; height:9px;
  background:#D7FE4F; border:2px solid var(--ink-950); border-radius:50%; }

/* SIDEBAR */
.sidebar { background:var(--ink-900); padding:22px 18px 18px; display:flex; flex-direction:column;
  border-right:1px solid rgba(255,255,255,.04); }
.brand { display:flex; align-items:center; justify-content:space-between; padding:4px 4px 26px; }
.brand-name { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:26px;
  color:var(--white); letter-spacing:-0.03em; }
.brand-name .ai-accent { color:var(--lime); }
.sidebar-collapse-btn { width:30px; height:30px; border:0; background:transparent;
  color:var(--text-on-dark-dim); display:grid; place-items:center; cursor:pointer;
  border-radius:8px; transition:background .18s, color .18s; }
.sidebar-collapse-btn:hover { background:rgba(255,255,255,.06); color:var(--text-on-dark); }
.sidebar-collapse-btn:active { transform:scale(.92); }
.nav { display:flex; flex-direction:column; gap:4px; }
.nav-item { display:flex; align-items:center; gap:12px; padding:13px 14px;
  border-radius:var(--radius-md); color:var(--text-on-dark-dim); font-size:14.5px; font-weight:500;
  transition:all .18s; width:100%; text-align:left; }
.nav-item:hover { color:var(--text-on-dark); background:rgba(255,255,255,.04); }
.nav-item.is-active { background:var(--ink-700); color:var(--white); }
.nav-item svg { flex-shrink:0; }
.nav-item .dot { width:6px; height:6px; border-radius:50%; background:var(--c-coral);
  margin-left:6px; box-shadow:0 0 8px rgba(242,107,107,.7); }

.sidebar-bottom { margin-top:auto; display:flex; flex-direction:column; gap:14px; }
.secondary-links { display:flex; flex-direction:column; gap:12px; padding:4px 14px; }
.secondary-links a { color:var(--text-on-dark-dim); font-size:13.5px; font-weight:500;
  text-decoration:none; }
.profile-card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06);
  border-radius:var(--radius-md); padding:10px; display:flex; align-items:center; gap:10px;
  position:relative; }
.profile-card .avatar { width:38px; height:38px; border-radius:10px;
  background:linear-gradient(135deg,#5b3f9c,#e6a8b8); display:grid; place-items:center;
  color:white; font-weight:600; font-size:13px; flex-shrink:0; overflow:hidden; position:relative; }
.profile-card .avatar svg { width:100%; height:100%; display:block; }
.profile-card .status-dot { position:absolute; top:8px; right:8px; width:10px; height:10px;
  background:#D7FE4F; border:2px solid var(--ink-900); border-radius:50%; }
.profile-meta { flex:1; min-width:0; }
.profile-name { display:flex; align-items:center; gap:6px; color:var(--white);
  font-size:13.5px; font-weight:600; }
.pro-badge { background:var(--purple); color:white; font-size:9.5px; font-weight:600;
  padding:2px 7px; border-radius:var(--radius-pill); }
.profile-email { color:var(--text-on-dark-dim); font-size:11.5px; margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.logout-btn { display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:11px 14px; border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03); border-radius:var(--radius-pill); cursor:pointer;
  color:var(--text-on-dark); font-size:13px; font-weight:500; transition:all .18s; }
.logout-btn:hover { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.14); }
.logout-btn:active { transform:scale(.98); }
.theme-toggle-pill { display:grid; grid-template-columns:1fr 1fr; gap:0;
  background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.06);
  border-radius:var(--radius-pill); padding:3px; }
.theme-opt { display:flex; align-items:center; justify-content:center; gap:6px;
  padding:8px 10px; border:0; background:transparent; cursor:pointer;
  color:var(--text-on-dark-dim); font-size:12px; font-weight:500; border-radius:var(--radius-pill);
  transition:all .18s; }
.theme-opt.is-active { background:var(--ink-700); color:var(--white); }
.theme-opt:not(.is-active):hover { color:var(--text-on-dark); }
.controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.ctrl { height:38px; border-radius:var(--radius-pill); background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06); color:var(--text-on-dark); display:flex;
  align-items:center; justify-content:center; gap:7px; font-size:12.5px; font-weight:500; }

/* MAIN */
.main { background:var(--cream); border-radius:24px 0 0 24px; overflow-y:auto; padding:30px 36px; }
.feed { background:var(--cream); padding:30px 24px; overflow-y:auto; border-left:1px solid var(--hairline); }

.page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-bottom:26px; }
.page-title { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:30px;
  letter-spacing:-0.025em; color:var(--text-950); line-height:1.15; }
.page-sub { color:var(--text-500); font-size:14px; margin-top:8px; }
.add-btn { width:48px; height:48px; background:var(--purple); color:white; border-radius:14px;
  display:grid; place-items:center; box-shadow:0 6px 16px rgba(124,107,244,.35); flex-shrink:0; }
.add-btn:active { transform:scale(.95); }

/* HOME */
.cards { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.topic-card { background:var(--white); border-radius:var(--radius-card); padding:22px;
  transition:all .22s; border:1px solid transparent; position:relative; min-width:0; text-align:left; width:100%; }
.topic-card:hover { box-shadow:var(--shadow-card); border-color:var(--hairline); }
.topic-card:active { transform:scale(.98); }
.topic-icon { width:42px; height:42px; display:grid; place-items:center; margin-bottom:22px; }
.topic-name { font-family:'Bricolage Grotesque',sans-serif; font-size:19px; font-weight:600;
  color:var(--text-900); letter-spacing:-0.015em; }
.topic-meta { position:absolute; bottom:22px; right:22px; color:var(--text-500); font-size:12px; font-weight:500; }

.cta { margin-top:18px; background:linear-gradient(135deg,#2A2C45 0%,#1B1D33 100%);
  border-radius:var(--radius-card); padding:30px; color:white; position:relative; overflow:hidden; }
.cta-title { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:28px;
  letter-spacing:-0.025em; line-height:1.15; max-width:380px; margin-bottom:8px; }
.cta-title .lime { color:var(--lime); }
.cta-sub { color:var(--text-on-dark-dim); font-size:13.5px; margin-bottom:18px; }
.cta-search { display:flex; gap:8px; background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07); padding:6px; border-radius:var(--radius-pill); }
.cta-input { flex:1; display:flex; align-items:center; gap:10px; padding:0 16px; min-width:0; }
.cta-input input { background:transparent; border:0; color:white; font-size:13.5px;
  outline:none; width:100%; min-width:0; }
.cta-input input::placeholder { color:var(--text-on-dark-dim); }
.cta-btn { background:var(--lime); color:var(--text-950); padding:0 28px; height:40px;
  border-radius:var(--radius-pill); font-weight:600; font-size:13.5px; flex-shrink:0; }

/* FEED */
.feed-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; }
.feed-title { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:22px;
  letter-spacing:-0.02em; color:var(--text-950); }
.feed-sub { color:var(--text-500); font-size:12.5px; margin-top:3px; }
.refresh-btn { background:var(--purple-bg); color:var(--purple); padding:7px 12px;
  border-radius:var(--radius-pill); font-size:12px; font-weight:500;
  display:flex; align-items:center; gap:5px; }

.promo { margin-top:14px;
  background:radial-gradient(circle at 80% 60%,rgba(170,215,110,.65),transparent 55%),linear-gradient(135deg,#1F4733 0%,#2A6048 60%,#4A8B6A 100%);
  border-radius:var(--radius-card); padding:24px 22px; color:white; min-height:180px; }
.promo-title { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:22px;
  letter-spacing:-0.02em; line-height:1.2; margin-bottom:4px; max-width:220px; }
.promo-sub { font-size:12.5px; opacity:.85; margin-bottom:18px; }
.promo-btn { background:var(--lime); color:var(--text-950); padding:10px 22px;
  border-radius:var(--radius-pill); font-weight:600; font-size:13px; }

.blog-heading { font-size:13.5px; font-weight:600; color:var(--text-900); margin:26px 0 12px; }
.blog-list { display:flex; flex-direction:column; gap:10px; }
.blog-card { background:var(--white); border-radius:var(--radius-lg); padding:14px;
  border:1px solid transparent; }
.blog-author { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.blog-avatar { width:36px; height:36px; border-radius:50%;
  background:linear-gradient(135deg,#c7d2fe,#a5b4fc); display:grid; place-items:center;
  font-weight:600; color:white; font-size:13px; flex-shrink:0; }
.blog-author-meta { flex:1; min-width:0; }
.blog-author-name { font-size:13px; font-weight:600; color:var(--text-900); }
.blog-author-desc { font-size:11.5px; color:var(--text-500); }
.blog-text { font-size:13px; color:var(--text-700); line-height:1.45; margin-bottom:12px; }
.blog-foot { display:flex; align-items:center; gap:14px; }
.blog-stat { display:flex; align-items:center; gap:5px; color:var(--text-500); font-size:12px; }
.open-btn { margin-left:auto; background:var(--purple-bg); color:var(--purple);
  padding:5px 14px; border-radius:var(--radius-pill); font-size:11.5px; font-weight:600; }

.av-1 { background:linear-gradient(135deg,#1a1a2e,#4a4a6e); }
.av-2 { background:linear-gradient(135deg,#f4c2a1,#e8a47b); }
.av-3 { background:linear-gradient(135deg,#b8c5d6,#8b9bb0); }
.av-4 { background:linear-gradient(135deg,#d4a574,#b8895a); }
.av-5 { background:linear-gradient(135deg,#7C6BF4,#A99CFF); }
.av-6 { background:linear-gradient(135deg,#4DD0C7,#6BD68A); }
.av-7 { background:linear-gradient(135deg,#F26B6B,#F0A23A); }
.av-8 { background:linear-gradient(135deg,#5B8FF9,#7C6BF4); }

/* PILLS / TABS */
.pill-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
.pill { background:var(--white); border:1px solid var(--hairline); color:var(--text-700);
  padding:8px 14px; border-radius:var(--radius-pill); font-size:13px; font-weight:500;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
.pill.is-active { background:var(--ink-900); color:var(--white); border-color:var(--ink-900); }
.pill .count { background:var(--hairline); color:var(--text-700); font-size:11px;
  padding:1px 7px; border-radius:var(--radius-pill); font-weight:600; }
.pill.is-active .count { background:rgba(255,255,255,.15); color:var(--white); }

/* PROJECTS */
.proj-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.proj-card { background:var(--white); border-radius:var(--radius-card); padding:22px;
  position:relative; overflow:hidden; min-width:0; text-align:left; width:100%;
  border:1px solid transparent; transition:border-color .2s; }
.proj-card:hover { border-color:var(--hairline); }
.proj-stripe { position:absolute; left:0; top:0; bottom:0; width:4px; }
.proj-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.proj-tag { font-size:11px; font-weight:600; padding:4px 10px; border-radius:var(--radius-pill);
  letter-spacing:.02em; text-transform:uppercase; }
.proj-name { font-family:'Bricolage Grotesque',sans-serif; font-size:19px; font-weight:600;
  color:var(--text-900); letter-spacing:-0.015em; margin-bottom:6px; }
.proj-desc { font-size:13px; color:var(--text-500); line-height:1.45; margin-bottom:18px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.proj-progress-head { display:flex; justify-content:space-between; font-size:11.5px;
  color:var(--text-500); font-weight:500; margin-bottom:6px; }
.proj-progress-bar { height:6px; background:var(--hairline); border-radius:var(--radius-pill); overflow:hidden; margin-bottom:16px; }
.proj-progress-fill { height:100%; border-radius:var(--radius-pill); transition:width .6s ease-out; }
.proj-foot { display:flex; align-items:center; justify-content:space-between; }
.avatar-stack { display:flex; }
.avatar-stack .avatar { width:26px; height:26px; border-radius:50%;
  border:2px solid var(--white); display:grid; place-items:center; color:white;
  font-weight:600; font-size:10px; margin-left:-8px; }
.avatar-stack .avatar:first-child { margin-left:0; }
.avatar-stack .more { background:var(--hairline); color:var(--text-700); }
.proj-due { display:flex; align-items:center; gap:6px; font-size:12px;
  color:var(--text-500); font-weight:500; }
.proj-delete { color:var(--text-400); width:24px; height:24px; border-radius:6px;
  display:grid; place-items:center; }
.proj-delete:hover { background:#FCE5E5; color:var(--c-coral); }

.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px; }
.stat-card { background:var(--white); border-radius:var(--radius-lg); padding:14px; }
.stat-label { font-size:11.5px; color:var(--text-500); font-weight:500; margin-bottom:6px; }
.stat-val { font-family:'Bricolage Grotesque',sans-serif; font-size:24px; font-weight:700;
  color:var(--text-950); letter-spacing:-0.02em; }
.stat-delta { font-size:11px; color:var(--c-green); font-weight:600; margin-top:4px; }
.stat-delta.neg { color:var(--c-coral); }

.activity { background:var(--white); border-radius:var(--radius-card); padding:18px; }
.activity-list { display:flex; flex-direction:column; gap:14px; }
.activity-item { display:flex; gap:10px; align-items:flex-start; }
.activity-dot { width:8px; height:8px; border-radius:50%; margin-top:5px; flex-shrink:0; }
.activity-text { font-size:12.5px; color:var(--text-700); line-height:1.45; }
.activity-text strong { color:var(--text-950); font-weight:600; }
.activity-time { font-size:11px; color:var(--text-400); margin-top:2px; }

/* AGENTS */
.agent-featured { background:radial-gradient(circle at 90% 30%,rgba(215,254,79,.25),transparent 50%),radial-gradient(circle at 10% 80%,rgba(124,107,244,.35),transparent 50%),linear-gradient(135deg,#1F1B3A 0%,#2D2856 100%);
  border-radius:var(--radius-card); padding:26px; color:white; margin-bottom:16px;
  position:relative; overflow:hidden; display:grid; grid-template-columns:1fr auto; gap:24px; align-items:center; }
.agent-featured-tag { display:inline-block; background:rgba(215,254,79,.15); color:var(--lime);
  font-size:10.5px; font-weight:600; padding:4px 10px; border-radius:var(--radius-pill);
  letter-spacing:.04em; text-transform:uppercase; margin-bottom:12px; }
.agent-featured-title { font-family:'Bricolage Grotesque',sans-serif; font-weight:700;
  font-size:26px; letter-spacing:-0.02em; line-height:1.2; margin-bottom:6px; }
.agent-featured-desc { font-size:13.5px; color:var(--text-on-dark-dim); margin-bottom:16px;
  max-width:380px; line-height:1.5; }
.agent-featured-cta { background:var(--lime); color:var(--text-950); padding:10px 20px;
  border-radius:var(--radius-pill); font-weight:600; font-size:13px;
  display:inline-flex; align-items:center; gap:6px; }
.agent-orb { width:130px; height:130px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#D7FE4F,#6BD68A 40%,#2A6048 80%);
  box-shadow:0 0 60px rgba(215,254,79,.4),inset -10px -20px 40px rgba(0,0,0,.3);
  animation:pulse 4s ease-in-out infinite; flex-shrink:0; }
@keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }

.agent-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.agent-card { background:var(--white); border-radius:var(--radius-card); padding:20px;
  border:1px solid transparent; min-width:0; }
.agent-card:hover { border-color:var(--hairline); }
.agent-avatar { width:48px; height:48px; border-radius:14px; display:grid; place-items:center;
  color:white; margin-bottom:14px; }
.agent-name { font-family:'Bricolage Grotesque',sans-serif; font-size:17px; font-weight:600;
  color:var(--text-900); letter-spacing:-0.015em; }
.agent-role { font-size:12px; color:var(--c-purple); font-weight:500; margin-top:2px; }
.agent-desc { font-size:12.5px; color:var(--text-500); line-height:1.45; margin:10px 0 14px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.agent-stats { display:flex; align-items:center; justify-content:space-between;
  padding-top:14px; border-top:1px solid var(--hairline); }
.agent-stat-group { display:flex; gap:12px; }
.agent-stat { display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--text-500); }
.agent-stat strong { color:var(--text-900); font-weight:600; }
.agent-use-btn { background:var(--ink-900); color:white; padding:6px 14px;

.mobile-header { display:none; position:sticky; top:0; left:0; right:0; height:56px;

const KEYS = ['page','topics','projects','agents','tasks','events'];
const LS_PREFIX = 'agentai:';
function hasClaudeStorage() { return typeof window !== 'undefined' && typeof window.storage !== 'undefined'; }
function hasLocalStorage() {
  try { return typeof localStorage !== 'undefined' && localStorage !== null; } catch(e) { return false; }
}
async function loadState() {
  for (const k of KEYS) {
    try {
      let v = null;
      if (hasClaudeStorage()) {
        const r = await window.storage.get(k);
        if (r && r.value) v = JSON.parse(r.value);
      } else if (hasLocalStorage()) {
        const raw = localStorage.getItem(LS_PREFIX + k);
        if (raw) v = JSON.parse(raw);
      }
      if (v != null) State[k] = v;
    } catch (e) {}
  }
}
function save(k) {
  try {
    const v = JSON.stringify(State[k]);
    if (hasClaudeStorage()) {
      window.storage.set(k, v).catch(()=>{});
    } else if (hasLocalStorage()) {
      localStorage.setItem(LS_PREFIX + k, v);
    }
  } catch(e) {}
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function relDay(iso) {
  const d = new Date(iso);
  const diff = Math.round((d - new Date(TODAY)) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  if (diff > 1 && diff < 7) return d.toLocaleDateString('en-US',{weekday:'long'});
  return MSHORT[d.getMonth()] + ' ' + d.getDate();
}
function timeAgo(t) {
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m/60);
  if (h < 24) return h + ' hr ago';
  return Math.floor(h/24) + ' days ago';
}
function getCalGrid(y, m) {
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const days = [];
  for (let i = firstDow-1; i >= 0; i--) {
    const d = new Date(y, m, -i);
    days.push({day:d.getDate(),m:d.getMonth(),y:d.getFullYear(),iso:isoKey(d),other:true});
  }
  for (let d = 1; d <= daysInMonth; d++) {
    days.push({day:d,m,y,iso:isoKey(new Date(y,m,d)),other:false});
  }
  while (days.length < 42) {
    const next = days.length - daysInMonth - firstDow + 1;
    const d = new Date(y, m+1, next);
    days.push({day:d.getDate(),m:d.getMonth(),y:d.getFullYear(),iso:isoKey(d),other:true});
  }
  return days;
}
function fmtTimer(s) {
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');

function renderTasks() {
  const counts = {
    today: State.tasks.filter(t=>t.date===TODAY && !t.done).length,
    upcoming: State.tasks.filter(t=>t.date > TODAY).length,
    overdue: State.tasks.filter(t=>t.date < TODAY && !t.done).length,
    completed: State.tasks.filter(t=>t.done).length
  };
  let list;
  if (State.taskTab==='today') list = State.tasks.filter(t=>t.date===TODAY).sort((a,b)=>Number(a.done)-Number(b.done));
  else if (State.taskTab==='upcoming') list = State.tasks.filter(t=>t.date>TODAY).sort((a,b)=>a.date.localeCompare(b.date));
  else if (State.taskTab==='overdue') list = State.tasks.filter(t=>t.date<TODAY && !t.done);
  else list = State.tasks.filter(t=>t.done).sort((a,b)=>b.createdAt-a.createdAt);

  const dueToday = State.tasks.filter(t=>t.date===TODAY && !t.done).length;
  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">Tasks</h1>
        <p class="page-sub">${relDay(TODAY)}, ${MSHORT[todayDate.getMonth()]} ${todayDate.getDate()} · ${dueToday} Tasks Due Today</p>
      </div>
      <button class="add-btn" data-action="open-modal" data-modal="task"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <form class="task-quickadd" data-action="quickadd-form">
      <button type="submit" class="task-quickadd-icon" data-action="quickadd-submit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <input id="quickadd-input" type="text" placeholder="Add a new task and press Enter…" autocomplete="off" />
    </form>
    <div class="tabs">
      ${[['today','Today'],['upcoming','Upcoming'],['overdue','Overdue'],['completed','Completed']].map(([k,l]) => `
        <button class="tab${State.taskTab===k?' is-active':''}" data-action="task-tab" data-tab="${k}">${l}<span class="count">${counts[k]}</span></button>
      `).join('')}
    </div>
    <div class="task-list">
      ${list.length===0 ? `<div class="task-empty">${State.taskTab==='completed'?'No completed tasks yet.':State.taskTab==='overdue'?'Nothing overdue. Nice.':'Nothing here. Add a task above.'}</div>` : ''}
      ${list.map(t => `
        <div class="task-row${t.done?' is-done':''}">
          <button class="task-check${t.done?' is-checked':''}" data-action="toggle-task" data-id="${t.id}">${t.done?'✓':''}</button>
          <div class="task-priority p-${t.priority}"></div>
          <div class="task-body">
            <div class="task-title">${esc(t.title)}</div>
            <div class="task-meta-row">
              <span class="task-project" style="background:${t.pBg};color:${t.pFg}">${esc(t.project)}</span>
              ${t.time?`<span class="task-time">${esc(t.time)}</span>`:''}
              ${State.taskTab!=='today'?`<span class="task-time">${relDay(t.date)}</span>`:''}
            </div>
          </div>
          <div class="task-assignee ${t.av}">${esc(t.assignee)}</div>
          <button class="task-delete" data-action="delete-task" data-id="${t.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg></button>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTasksFeed() {
  const total = State.tasks.filter(t=>t.date===TODAY).length;
  const done = State.tasks.filter(t=>t.date===TODAY && t.done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  const offset = 364 - (364 * pct / 100);
  return `
    <div class="feed-head"><div><h2 class="feed-title">Today</h2><p class="feed-sub">Your daily focus</p></div></div>
    <div class="progress-ring-card">
      <div class="progress-ring">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="58" fill="none" stroke="#ECECF1" stroke-width="12"/>
          <circle cx="70" cy="70" r="58" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="364" stroke-dashoffset="${offset}" transform="rotate(-90 70 70)" style="transition:stroke-dashoffset .6s ease-out"/>
          <defs><linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7C6BF4"/><stop offset="100%" stop-color="#A99CFF"/></linearGradient></defs>
        </svg>
        <div class="progress-ring-text">
          <div class="progress-ring-num">${pct}%</div>
          <div class="progress-ring-label">${done} of ${total} done</div>
        </div>
      </div>
      <div class="progress-ring-title">${pct>=50?"You're On Track":"Let's Get Going"}</div>
      <div class="progress-ring-sub">${total-done===0?'All done — celebrate.':(total-done)+' task'+(total-done===1?'':'s')+' remaining'}</div>
    </div>
    <div class="focus-timer">
      <div class="focus-label">Focus Session</div>
      <div class="focus-time" id="pomo-time">${fmtTimer(State.pomoSec)}</div>
      <button class="focus-btn" data-action="toggle-pomo">${State.pomoRunning?'Pause':'Start Pomodoro'}</button>
    </div>
  `;
}

function renderCalendar() {
  const grid = getCalGrid(State.calY, State.calM);
  const totalEvents = Object.entries(State.events).reduce((s,[k,arr]) => {
    const d = new Date(k);
    return d.getFullYear()===State.calY && d.getMonth()===State.calM ? s+arr.length : s;
  }, 0);
  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">${MONTHS[State.calM]} ${State.calY}</h1>
        <p class="page-sub">Your Month At A Glance — ${totalEvents} Events Scheduled</p>
      </div>
      <button class="add-btn" data-action="open-modal" data-modal="event" data-date="${TODAY}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div class="cal-toolbar">
      <button class="cal-nav-btn" data-action="cal-prev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <button class="cal-today-btn" data-action="cal-today">Today</button>
      <button class="cal-nav-btn" data-action="cal-next"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button>
      <div class="cal-view-toggle">
        <button class="cal-view-opt">Day</button>
        <button class="cal-view-opt">Week</button>
        <button class="cal-view-opt is-active">Month</button>
      </div>
    </div>
    <div class="cal-grid">
      <div class="cal-week-head">
        ${WDAYS.map(d=>`<div class="cal-week-head-cell">${d}</div>`).join('')}
      </div>
      <div class="cal-body">
        ${grid.map(d => {
          const events = State.events[d.iso] || [];
          const shown = events.slice(0, 2);
          const more = events.length - shown.length;
          const isToday = d.iso === TODAY;
          return `
            <button class="cal-day${d.other?' is-other-month':''}${isToday?' is-today':''}" data-action="open-modal" data-modal="event" data-date="${d.iso}">
              <span class="cal-day-num">${d.day}</span>
              ${shown.map(e => `<div class="cal-event" style="background:${e.bg};color:${e.fg}">${esc(e.title)}</div>`).join('')}
              ${more>0?`<div class="cal-event" style="background:var(--hairline);color:var(--text-700)">+${more} more</div>`:''}
            </button>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderCalendarFeed() {
  const todayEv = State.events[TODAY] || [];
  const upcoming = [];
  for (let i=1; i<=14; i++) {
    const d = new Date(); d.setDate(d.getDate()+i);
    const k = isoKey(d);
    (State.events[k]||[]).forEach(e => upcoming.push({...e, iso:k, d}));
    if (upcoming.length >= 5) break;
  }
  return `
    <div class="feed-head"><div><h2 class="feed-title">Today's Schedule</h2><p class="feed-sub">${relDay(TODAY)}, ${MSHORT[todayDate.getMonth()]} ${todayDate.getDate()}</p></div></div>
    <div class="timeline">
      ${todayEv.length===0 ? '<div class="timeline-empty">Nothing on the calendar today.</div>' : `
        <div class="timeline-list">
          ${todayEv.map(e => `
            <div class="timeline-item">
              <div class="timeline-time">${esc(e.time)}</div>
              <div class="timeline-block" style="background:${e.bg};border-color:${e.fg}">
                <div class="timeline-block-title">${esc(e.title)}</div>
                <div class="timeline-block-meta">${esc(e.meta)}</div>
              </div>
            </div>
          `).join('')}
        </div>`}
    </div>
    <div class="upcoming-card">
      <h3 class="upcoming-title">Upcoming</h3>
      ${upcoming.length===0 ? '<div style="padding:14px 0;color:var(--text-500);font-size:13px">Nothing scheduled yet.</div>' : ''}
      ${upcoming.slice(0,5).map(u => `
        <div class="up-item">
          <div class="up-date"><div class="up-date-d">${u.d.getDate()}</div><div class="up-date-m">${WDAYS[u.d.getDay()]}</div></div>
          <div class="up-body"><div class="up-name">${esc(u.title)}</div><div class="up-time">${esc(u.time)} · ${esc(u.meta)}</div></div>
        </div>
      `).join('')}
    </div>
  `;
}

// ============================================================
// MAIN RENDER
// ============================================================
function render() {
  // Sidebar / backdrop drawer state
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('backdrop');
  // Active nav state
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.classList.toggle('is-active', el.dataset.nav === State.page);
  });
  document.querySelectorAll('[data-rail]').forEach(el => {
    el.classList.toggle('is-active', el.dataset.rail === State.page);
  });
  // Task dot
  const dueToday = State.tasks.filter(t=>t.date===TODAY && !t.done).length;
  const dot = document.getElementById('task-dot');
  if (dot) dot.className = dueToday > 0 ? 'dot' : '';

  // Render main + feed
  let main, feed;
  switch(State.page) {
    case 'home': main = renderHome(); feed = renderHomeFeed(); break;
    case 'projects': main = renderProjects(); feed = renderProjectsFeed(); break;
    case 'agents': main = renderAgents(); feed = renderAgentsFeed(); break;
    case 'tasks': main = renderTasks(); feed = renderTasksFeed(); break;
    case 'calendar': main = renderCalendar(); feed = renderCalendarFeed(); break;
  }
  document.getElementById('main-host').innerHTML = main;
  document.getElementById('feed-host').innerHTML = feed;

  // Modal
  const mh = document.getElementById('modal-host');
  mh.innerHTML = renderModal();
  mh.classList.toggle('is-open', !!State.modal);

  // Restore focus on modal
  if (State.modal) {
    setTimeout(() => { const i = document.getElementById('m-name'); if (i) i.focus(); }, 50);
  }
}

// ============================================================
// EVENT DELEGATION
// ============================================================
document.body.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;
  const data = t.dataset;

  switch (action) {
    case 'nav':
      State.page = data.page;
      document.getElementById('sidebar').classList.remove('is-open');
      document.getElementById('backdrop').classList.remove('is-open');
      save('page');
      render();
      break;

    case 'open-menu':
      document.getElementById('sidebar').classList.add('is-open');
      document.getElementById('backdrop').classList.add('is-open');
      break;

    case 'toggle-sidebar':
      document.querySelector('.app').classList.toggle('is-sidebar-collapsed');
      break;

    case 'toggle-theme': {
      const cur = document.body.dataset.theme === 'light' ? 'dark' : 'light';
      applyTheme(cur);
      break;
    }

    case 'set-theme':
      applyTheme(data.theme);
      break;

    case 'logout':
      State.modal = { type: 'logout' };
      render();
      break;

    case 'confirm-logout':
      State.modal = null;
      // Demo only — show a transient toast-style overlay
      const t = document.createElement('div');
      t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink-950);color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:500;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.3);';
      t.textContent = 'Logged out (demo)';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2000);
      render();
      break;

    case 'close-menu':
      document.getElementById('sidebar').classList.remove('is-open');
      document.getElementById('backdrop').classList.remove('is-open');
      break;

    case 'toggle-task': {
      const id = data.id;
      const task = State.tasks.find(t=>t.id===id);
      if (task) { task.done = !task.done; save('tasks'); render(); }
      break;
    }

    case 'delete-task':
      e.stopPropagation();
      State.tasks = State.tasks.filter(t=>t.id!==data.id);
      save('tasks'); render();
      break;

    case 'delete-project':
      e.stopPropagation();
      State.projects = State.projects.filter(p=>p.id!==data.id);
      save('projects'); render();
      break;

    case 'task-tab':
      State.taskTab = data.tab;
      render();
      break;

    case 'proj-filter':
      State.projFilter = data.filter;
      render();
      break;

    case 'agent-filter':
      State.agentFilter = data.filter;
      render();
      break;

    case 'use-agent': {
      const a = State.agents.find(x=>x.id===data.id);
      if (a) { a.runs++; a.lastUsed = Date.now(); save('agents'); render(); }
      break;
    }

    case 'cal-prev':
      if (State.calM === 0) { State.calM = 11; State.calY--; } else State.calM--;
      render();
      break;

    case 'cal-next':
      if (State.calM === 11) { State.calM = 0; State.calY++; } else State.calM++;
      render();
      break;

    case 'cal-today':
      State.calY = todayDate.getFullYear();
      State.calM = todayDate.getMonth();
      render();
      break;

    case 'open-modal':
      State.modal = { type: data.modal, date: data.date, colorIdx: 0 };
      render();
      break;

    case 'close-modal':
      State.modal = null;
      render();
      break;

    case 'swatch':
      if (State.modal) {
        State.modal.colorIdx = parseInt(data.i, 10);
        document.querySelectorAll('.color-swatch').forEach((el,idx) => {
          el.classList.toggle('is-selected', idx === State.modal.colorIdx);
        });
      }
      break;

    case 'save-topic': {
      const name = document.getElementById('m-name').value.trim();
      if (!name) return;
      const icon = document.getElementById('m-icon').value;
      const page = document.getElementById('m-page').value;
      const p = PALETTE[State.modal.colorIdx || 0];
      State.topics.push({ id:'t'+Date.now(), name, icon, color:p.c, page });
      save('topics');
      State.modal = null;
      render();
      break;
    }

    case 'save-project': {
      const name = document.getElementById('m-name').value.trim();
      if (!name) return;
      const desc = document.getElementById('m-desc').value.trim() || 'No description yet.';
      const category = document.getElementById('m-cat').value;
      const due = document.getElementById('m-due').value || 'TBD';
      const p = PALETTE[State.modal.colorIdx || 0];
      State.projects.unshift({
        id:'p'+Date.now(), name, desc, category, color:p.c, tagFg:p.fg, tagBg:p.bg,
        progress:0, due, team:[{i:'MW',c:'av-1'}], teamMore:0, status:'active'
      });
      save('projects');
      State.modal = null;
      render();
      break;
    }

    case 'save-task': {
      const title = document.getElementById('m-name').value.trim();
      if (!title) return;
      const priority = document.getElementById('m-prio').value;
      const time = document.getElementById('m-time').value.trim();
      const date = document.getElementById('m-date').value || TODAY;
      const projId = document.getElementById('m-proj').value;
      const proj = State.projects.find(x=>x.id===projId);
      State.tasks.unshift({
        id:'tk'+Date.now(), title,
        project: proj ? proj.name : 'Inbox',
        pFg: proj ? proj.tagFg : '#7C6BF4',
        pBg: proj ? proj.tagBg : '#EDEAFE',
        time, priority,
        assignee:'MW', av:'av-1',
        done:false, date, createdAt:Date.now()
      });
      save('tasks');
      State.modal = null;
      render();
      break;
    }

    case 'save-event': {
      const title = document.getElementById('m-name').value.trim();
      if (!title) return;
      const date = document.getElementById('m-date').value || TODAY;
      const time = document.getElementById('m-time').value.trim() || 'All Day';
      const meta = document.getElementById('m-meta').value.trim();
      const p = PALETTE[State.modal.colorIdx || 0];
      State.events[date] = State.events[date] || [];
      State.events[date].push({ id:'e'+Date.now(), title, time, meta, bg:p.bg, fg:p.fg });
      save('events');
      State.modal = null;
      render();
      break;
    }

    case 'toggle-pomo':
      if (State.pomoRunning) {
        State.pomoRunning = false;
        clearInterval(State.pomoTimer);
      } else {
        State.pomoRunning = true;
        State.pomoTimer = setInterval(() => {
          State.pomoSec--;
          if (State.pomoSec <= 0) {
            State.pomoSec = 25*60;
            State.pomoRunning = false;
            clearInterval(State.pomoTimer);
          }
          const el = document.getElementById('pomo-time');
          if (el) el.textContent = fmtTimer(State.pomoSec);
        }, 1000);
      }
      render();
      break;
  }
});

// Task quickadd form
document.body.addEventListener('submit', (e) => {
  if (e.target.matches('[data-action="quickadd-form"]')) {
    e.preventDefault();
    const input = document.getElementById('quickadd-input');
    if (!input) return;
    const v = input.value.trim();
    if (!v) return;
    State.tasks.unshift({
      id:'tk'+Date.now(), title: v,
      project: 'Inbox', pFg:'#7C6BF4', pBg:'#EDEAFE',
      time:'', priority:'low',
      assignee:'MW', av:'av-1',
      done:false, date:TODAY, createdAt:Date.now()
    });
    save('tasks');
    input.value = '';
    render();
  }
});

// Escape closes modal/drawer
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (State.modal) { State.modal = null; render(); }
    else {
      document.getElementById('sidebar').classList.remove('is-open');
      document.getElementById('backdrop').classList.remove('is-open');
    }
  }
});

// ============================================================
// BOOT
// ============================================================
(async function boot() {
  await loadState();
  render();
})();
</script>
