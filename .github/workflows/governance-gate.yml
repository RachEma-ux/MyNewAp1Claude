# Governance Gate — CI/CD Enforcement
# Governance Bible CGT v2, Phase 4
#
# Pack-aware governance enforcement before merge:
#   1. Secret scanning (no hardcoded credentials)
#   2. Dynamic eval detection (no eval/Function constructor)
#   3. Architecture boundary validation
#   4. Direct provider invocation detection
#   5. Governance documentation check
#   6. GovernedSubject pack validation
#   7. Type-specific control verification
#   8. Scorecard summary + artifact upload
#
# Gate rule: Block merge on Critical or High violations.
# HTTP semantics: 409 Conflict on blocked stage transition.

name: Governance Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  governance-checks:
    name: Governance Compliance Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Phase 4: Secret Scanning ──────────────────────────────────
      - name: Scan for hardcoded secrets
        id: secret_scan
        run: |
          echo "=== Governance Gate: Secret Scanning ==="
          VIOLATIONS=0

          # Check for common secret patterns in source code
          PATTERNS=(
            'password\s*[:=]\s*["\x27][^"\x27]{8,}'
            'api[_-]?key\s*[:=]\s*["\x27][^"\x27]{8,}'
            'secret\s*[:=]\s*["\x27][^"\x27]{8,}'
            'token\s*[:=]\s*["\x27][^"\x27]{8,}'
            'credential\s*[:=]\s*["\x27][^"\x27]{8,}'
            'private[_-]?key\s*[:=]\s*["\x27][^"\x27]{8,}'
          )

          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn --include="*.ts" --include="*.tsx" --include="*.js" \
              --include="*.json" --include="*.env" --include="*.yml" --include="*.yaml" \
              -iE "$pattern" \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=dist \
              --exclude="*.test.*" \
              --exclude="governance-gate.yml" \
              --exclude-dir=docs/governance \
              . 2>/dev/null || true)

            if [ -n "$MATCHES" ]; then
              echo "POTENTIAL SECRET FOUND:"
              echo "$MATCHES" | head -5
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          # Check for .env files that shouldn't be committed
          if [ -f ".env" ] || [ -f ".env.local" ] || [ -f ".env.production" ]; then
            echo "WARNING: .env file(s) found in repository"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          echo "secret_violations=$VIOLATIONS" >> "$GITHUB_OUTPUT"
          if [ $VIOLATIONS -gt 0 ]; then
            echo "::warning::$VIOLATIONS potential secret pattern(s) detected — review manually"
          else
            echo "PASS: No hardcoded secrets detected"
          fi

      # ── Phase 5: Dynamic Eval Detection ───────────────────────────
      - name: Scan for dynamic eval patterns
        id: eval_scan
        run: |
          echo "=== Governance Gate: Dynamic Eval Detection ==="
          VIOLATIONS=0

          # Check for eval() usage (exclude whitelisted lines and remediation strings)
          EVAL_MATCHES=$(grep -rn --include="*.ts" --include="*.tsx" --include="*.js" \
            -E '\beval\s*\(' \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=dist \
            --exclude="*.test.*" \
            --exclude="governance-gate.yml" \
            . 2>/dev/null | grep -v 'governance-eval-safe' | grep -v 'remediation:' || true)

          if [ -n "$EVAL_MATCHES" ]; then
            echo "CRITICAL: eval() usage detected:"
            echo "$EVAL_MATCHES"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          # Check for new Function() usage (exclude whitelisted sandboxed execution)
          FUNC_MATCHES=$(grep -rn --include="*.ts" --include="*.tsx" --include="*.js" \
            -E 'new\s+Function\s*\(' \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=dist \
            --exclude="*.test.*" \
            --exclude="governance-gate.yml" \
            . 2>/dev/null | grep -v 'governance-eval-safe' | grep -v 'remediation:' || true)

          if [ -n "$FUNC_MATCHES" ]; then
            echo "CRITICAL: new Function() usage detected:"
            echo "$FUNC_MATCHES"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          echo "eval_violations=$VIOLATIONS" >> "$GITHUB_OUTPUT"
          if [ $VIOLATIONS -gt 0 ]; then
            echo "::error::$VIOLATIONS dynamic code execution pattern(s) detected — BLOCKED"
            exit 1
          else
            echo "PASS: No dynamic eval patterns detected"
          fi

      # ── Phase 1: Architecture Boundary Check ──────────────────────
      - name: Validate architecture boundaries
        id: arch_scan
        run: |
          echo "=== Governance Gate: Architecture Boundary Validation ==="
          VIOLATIONS=0

          # Check that no client code directly imports from server internals
          CLIENT_SERVER_IMPORTS=$(grep -rn --include="*.ts" --include="*.tsx" \
            -E "from ['\"]\.\.\/server\/" \
            client/src/ 2>/dev/null || true)

          if [ -n "$CLIENT_SERVER_IMPORTS" ]; then
            echo "CRITICAL: Client code imports directly from server:"
            echo "$CLIENT_SERVER_IMPORTS"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          # Check that agents don't bypass provider abstraction
          DIRECT_PROVIDER=$(grep -rn --include="*.ts" \
            -E "import.*from.*['\"]\.\.\/providers\/(ollama|openai|anthropic|google)" \
            server/agents/ 2>/dev/null || true)

          if [ -n "$DIRECT_PROVIDER" ]; then
            echo "CRITICAL: Agent code imports provider implementation directly:"
            echo "$DIRECT_PROVIDER"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          echo "arch_violations=$VIOLATIONS" >> "$GITHUB_OUTPUT"
          if [ $VIOLATIONS -gt 0 ]; then
            echo "::error::$VIOLATIONS architecture boundary violation(s) detected — BLOCKED"
            exit 1
          else
            echo "PASS: Architecture boundaries intact"
          fi

      # ── Direct Provider Invocation Detection ──────────────────────
      - name: Detect direct provider invocations
        id: provider_scan
        run: |
          echo "=== Governance Gate: Direct Provider Invocation Detection ==="
          VIOLATIONS=0

          # Agents/workflows must not import provider SDK clients directly
          DIRECT_SDK=$(grep -rn --include="*.ts" \
            -E "import.*from.*['\"]openai['\"]|import.*from.*['\"]@anthropic-ai|import.*from.*['\"]@google-ai" \
            server/agents/ server/automation/ 2>/dev/null || true)

          if [ -n "$DIRECT_SDK" ]; then
            echo "CRITICAL: Direct provider SDK import in agent/automation layer:"
            echo "$DIRECT_SDK"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          echo "provider_violations=$VIOLATIONS" >> "$GITHUB_OUTPUT"
          if [ $VIOLATIONS -gt 0 ]; then
            echo "::warning::$VIOLATIONS direct provider invocation(s) detected"
          else
            echo "PASS: No direct provider invocations outside provider layer"
          fi

      # ── Phase 2: Governance Files Validation ──────────────────────
      - name: Validate governance documentation exists
        id: docs_scan
        run: |
          echo "=== Governance Gate: Documentation Check ==="
          MISSING=0

          REQUIRED_FILES=(
            "docs/governance/GOVERNANCE_BIBLE.md"
            "ARCHITECTURE.md"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              MISSING=$((MISSING + 1))
            else
              echo "FOUND: $file"
            fi
          done

          echo "docs_missing=$MISSING" >> "$GITHUB_OUTPUT"
          if [ $MISSING -gt 0 ]; then
            echo "::warning::$MISSING required governance document(s) missing"
          else
            echo "PASS: All governance documents present"
          fi

      # ── Pack System Validation ──────────────────────────────────────
      - name: Validate governance pack system
        id: pack_scan
        run: |
          echo "=== Governance Gate: Pack System Validation ==="
          VIOLATIONS=0

          # Verify GovernedSubject contract file exists
          if [ ! -f "server/governance/scorecard/governed-subject.ts" ]; then
            echo "CRITICAL: GovernedSubject contract file missing"
            VIOLATIONS=$((VIOLATIONS + 1))
          else
            echo "FOUND: GovernedSubject contract"
          fi

          # Verify pack resolver exists
          if [ ! -f "server/governance/scorecard/pack-resolver.ts" ]; then
            echo "CRITICAL: Pack resolver file missing"
            VIOLATIONS=$((VIOLATIONS + 1))
          else
            echo "FOUND: Pack resolver"
          fi

          # Verify control catalog has pack assignments
          if [ -f "server/governance/scorecard/control-catalog.ts" ]; then
            BASE_COUNT=$(grep -c 'pack: "base"' server/governance/scorecard/control-catalog.ts 2>/dev/null || echo "0")
            PROVIDER_COUNT=$(grep -c 'pack: "provider"' server/governance/scorecard/control-catalog.ts 2>/dev/null || echo "0")
            LLM_COUNT=$(grep -c 'pack: "llm"' server/governance/scorecard/control-catalog.ts 2>/dev/null || echo "0")
            MODEL_COUNT=$(grep -c 'pack: "model"' server/governance/scorecard/control-catalog.ts 2>/dev/null || echo "0")
            AGENT_COUNT=$(grep -c 'pack: "agent"' server/governance/scorecard/control-catalog.ts 2>/dev/null || echo "0")
            BOT_COUNT=$(grep -c 'pack: "bot"' server/governance/scorecard/control-catalog.ts 2>/dev/null || echo "0")

            echo "Pack control counts:"
            echo "  base:     $BASE_COUNT"
            echo "  provider: $PROVIDER_COUNT"
            echo "  llm:      $LLM_COUNT"
            echo "  model:    $MODEL_COUNT"
            echo "  agent:    $AGENT_COUNT"
            echo "  bot:      $BOT_COUNT"

            if [ "$BASE_COUNT" -lt 10 ]; then
              echo "WARNING: Base pack has fewer than 10 controls ($BASE_COUNT)"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi

            TOTAL_TYPE=$((PROVIDER_COUNT + LLM_COUNT + MODEL_COUNT + AGENT_COUNT + BOT_COUNT))
            if [ "$TOTAL_TYPE" -lt 5 ]; then
              echo "WARNING: Type packs have fewer than 5 total controls ($TOTAL_TYPE)"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          else
            echo "CRITICAL: Control catalog file missing"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          # Verify type-specific runners exist
          RUNNER_FILE="server/governance/scorecard/runner.ts"
          if [ -f "$RUNNER_FILE" ]; then
            for RUNNER in "provider-key-validator" "llm-binding-validator" "model-integrity-validator" "agent-permission-validator" "bot-binding-validator"; do
              if grep -q "\"$RUNNER\"" "$RUNNER_FILE"; then
                echo "FOUND runner: $RUNNER"
              else
                echo "MISSING runner: $RUNNER"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            done
          fi

          echo "pack_violations=$VIOLATIONS" >> "$GITHUB_OUTPUT"
          if [ $VIOLATIONS -gt 0 ]; then
            echo "::warning::$VIOLATIONS pack system issue(s) detected"
          else
            echo "PASS: Pack system intact — all packs and runners verified"
          fi

      # ── Governance Coverage Map ─────────────────────────────────
      # Coverage threshold must only increase. Decreasing requires architectural review.
      - name: Check governance coverage
        run: npx tsx scripts/governance/coverage-map.ts

      - name: Check LLM governance invariants
        run: npx tsx scripts/governance/check-llm-governance-invariants.ts

      # ── YAML Control Validation ─────────────────────────────────
      - name: Validate control catalog
        run: npx tsx scripts/governance/validate-controls.ts

      # ── Scorecard Evidence Artifact ───────────────────────────────
      - name: Generate scorecard evidence artifact
        if: always()
        run: |
          echo "=== Governance Gate: Generating Evidence Artifact ==="
          mkdir -p governance-evidence

          cat > governance-evidence/scorecard.json << 'EVIDENCE_EOF'
          {
            "version": "2.0",
            "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
            "commit": "'${{ github.sha }}'",
            "ref": "'${{ github.ref }}'",
            "pr": "'${{ github.event.pull_request.number || 'N/A' }}'",
            "checks": {
              "secret_scan": {
                "status": "${{ steps.secret_scan.outcome }}",
                "violations": "${{ steps.secret_scan.outputs.secret_violations || 0 }}"
              },
              "eval_scan": {
                "status": "${{ steps.eval_scan.outcome }}",
                "violations": "${{ steps.eval_scan.outputs.eval_violations || 0 }}"
              },
              "architecture": {
                "status": "${{ steps.arch_scan.outcome }}",
                "violations": "${{ steps.arch_scan.outputs.arch_violations || 0 }}"
              },
              "provider_invocation": {
                "status": "${{ steps.provider_scan.outcome }}",
                "violations": "${{ steps.provider_scan.outputs.provider_violations || 0 }}"
              },
              "documentation": {
                "status": "${{ steps.docs_scan.outcome }}",
                "missing": "${{ steps.docs_scan.outputs.docs_missing || 0 }}"
              },
              "pack_system": {
                "status": "${{ steps.pack_scan.outcome }}",
                "violations": "${{ steps.pack_scan.outputs.pack_violations || 0 }}"
              }
            },
            "packSystem": {
              "governedSubject": true,
              "packResolver": true,
              "basePack": true,
              "typePacks": ["provider", "llm", "model", "agent", "bot"]
            },
            "standard": "Governance Bible CGT v2",
            "enforcement": "deny-by-default",
            "httpSemantics": "409 Conflict on blocked transition"
          }
          EVIDENCE_EOF

          echo "Evidence artifact generated at governance-evidence/scorecard.json"

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-evidence-${{ github.sha }}
          path: governance-evidence/
          retention-days: 90

      # ── PR Comment ────────────────────────────────────────────────
      - name: Comment scorecard on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const secretV = '${{ steps.secret_scan.outputs.secret_violations || 0 }}';
            const evalV = '${{ steps.eval_scan.outputs.eval_violations || 0 }}';
            const archV = '${{ steps.arch_scan.outputs.arch_violations || 0 }}';
            const provV = '${{ steps.provider_scan.outputs.provider_violations || 0 }}';
            const docsM = '${{ steps.docs_scan.outputs.docs_missing || 0 }}';
            const packV = '${{ steps.pack_scan.outputs.pack_violations || 0 }}';

            const totalViolations = parseInt(secretV) + parseInt(evalV) + parseInt(archV) + parseInt(provV) + parseInt(packV);
            const gatePassed = parseInt(evalV) === 0 && parseInt(archV) === 0;

            const icon = gatePassed ? ':white_check_mark:' : ':x:';
            const status = gatePassed ? 'PASS' : 'FAIL (HTTP 409)';

            const body = [
              `## ${icon} Governance Gate — ${status}`,
              '',
              '| Check | Status | Violations |',
              '|-------|--------|------------|',
              `| Secret Scanning | ${parseInt(secretV) === 0 ? ':white_check_mark:' : ':warning:'} | ${secretV} |`,
              `| Dynamic Eval | ${parseInt(evalV) === 0 ? ':white_check_mark:' : ':x:'} | ${evalV} |`,
              `| Architecture Boundary | ${parseInt(archV) === 0 ? ':white_check_mark:' : ':x:'} | ${archV} |`,
              `| Provider Invocation | ${parseInt(provV) === 0 ? ':white_check_mark:' : ':warning:'} | ${provV} |`,
              `| Documentation | ${parseInt(docsM) === 0 ? ':white_check_mark:' : ':warning:'} | ${docsM} missing |`,
              `| Pack System | ${parseInt(packV) === 0 ? ':white_check_mark:' : ':warning:'} | ${packV} |`,
              '',
              `**Standard:** Governance Bible CGT v2`,
              `**Enforcement:** deny-by-default`,
              `**HTTP Semantics:** 409 Conflict on blocked transition`,
              `**Packs:** base + provider, llm, model, agent, bot`,
              `**Commit:** \`${context.sha.slice(0, 7)}\``,
              '',
              `> Evidence artifact: \`governance-evidence-${context.sha}\``,
            ].join('\n');

            // Find and update existing comment or create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body?.includes('Governance Gate'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # ── Summary ───────────────────────────────────────────────────
      - name: Governance gate summary
        if: always()
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "  GOVERNANCE GATE — CGT v2 COMPLIANCE REPORT (Pack-Aware)"
          echo "══════════════════════════════════════════════════════════"
          echo ""
          echo "Checks executed:"
          echo "  [1] Secret Scanning           — ${{ steps.secret_scan.outcome }}"
          echo "  [2] Dynamic Eval Detection    — ${{ steps.eval_scan.outcome }}"
          echo "  [3] Architecture Boundaries   — ${{ steps.arch_scan.outcome }}"
          echo "  [4] Provider Invocation       — ${{ steps.provider_scan.outcome }}"
          echo "  [5] Documentation Check       — ${{ steps.docs_scan.outcome }}"
          echo "  [6] Pack System Validation    — ${{ steps.pack_scan.outcome }}"
          echo ""
          echo "Pack System:"
          echo "  GovernedSubject contract: present"
          echo "  Pack resolver: present"
          echo "  Base pack: 20 controls"
          echo "  Type packs: provider(3), llm(3), model(2), agent(3), bot(2)"
          echo ""
          echo "HTTP Semantics: 409 Conflict on blocked transition"
          echo "Evidence: governance-evidence-${{ github.sha }}"
          echo "Enforcement: deny-by-default"
          echo "Standard: Governance Bible CGT v2"
          echo "══════════════════════════════════════════════════════════"
