# Native Graph Workspace MVP 4 — Phase 22 / 23 (G10 evaluation surface).
#
# Operator-triggered execution of the Golden Question evaluation
# runbook at
#   docs/runbooks/agent-studio-native-graph-workspace-golden-questions-evaluation-runbook.md
#
# This workflow is `workflow_dispatch` only — the operator triggers
# it from the Actions tab or via `gh workflow run`.
#
# Outputs:
#   - GitHub Actions artifact: golden-questions-report-${run_id}.zip
#     containing the markdown inventory + (when live wiring lands)
#     per-question results.
#
# Live-wiring status (2026-05-13):
#   Live evaluation IS wired. The script's --mode=live branch composes
#   the Graph Agent Lite engine + GraphRepository + GraphRetrievalRouter
#   + OpenRouter Model Access (`execute()` via `withProviderCredential`)
#   + MCP dispatcher, then scores each seeded question against
#   `expectedPaths` + `minimumCitationCount` + optional regex pattern.
#   Pass requires every suite to pass. Failure exits non-zero.
#
#   Dry-run mode (default) emits the inventory-only report and exits 0
#   for repo-state validation.

name: Golden Questions — Live Evaluation (G10)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite key to run (or "all")'
        required: false
        default: 'all'
      mode:
        description: 'Evaluation mode. "dry-run" emits an inventory report; "live" composes the engine and scores answers (requires the live-mode secrets to be configured).'
        required: false
        default: 'dry-run'
        type: choice
        options:
          - 'dry-run'
          - 'live'
      provider_connection_id:
        description: 'Provider connection row id for the model-access binding. Required in live mode.'
        required: false
        default: ''
      model_ref:
        description: 'Model ref (e.g. "anthropic/claude-3-5-sonnet"). Required in live mode.'
        required: false
        default: ''
      workspace_id:
        description: 'Workspace id (smoke vault). Required in live mode.'
        required: false
        default: ''
      actor_id:
        description: 'Actor / user id for the engine run. Required in live mode.'
        required: false
        default: ''

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: asdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/asdb
      DATABASE_URL_ASDB: postgres://testuser:testpass@localhost:5432/asdb
      # Provider credential resolution happens inside
      # `withProviderCredential` (Plan v3 D1) — neither the script
      # body nor this workflow reads raw key env vars directly. The
      # secret is staged here so the provider-connections seed step
      # (when present) can register the connection row that the
      # live-mode adapter will resolve by id.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOLDEN_Q_LIVE: ${{ github.event.inputs.mode == 'live' && 'true' || 'false' }}
      GOLDEN_Q_LIVE_PROVIDER_CONNECTION_ID: ${{ github.event.inputs.provider_connection_id }}
      GOLDEN_Q_LIVE_MODEL_REF: ${{ github.event.inputs.model_ref }}
      GOLDEN_Q_LIVE_WORKSPACE_ID: ${{ github.event.inputs.workspace_id }}
      GOLDEN_Q_LIVE_ACTOR_ID: ${{ github.event.inputs.actor_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply ASDB schema
        run: npx drizzle-kit push --force

      - name: Seed Golden Question suites
        run: npx tsx scripts/agent-studio/seed-golden-questions.ts

      - name: Compute run date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Run Golden Questions evaluation
        run: |
          mkdir -p "docs/evidence/graph-agent-lite/${{ steps.date.outputs.date }}-golden-questions"
          npx tsx scripts/agent-studio/run-golden-questions.ts \
            --suite "${{ github.event.inputs.suite }}" \
            --mode "${{ github.event.inputs.mode }}" \
            --output "docs/evidence/graph-agent-lite/${{ steps.date.outputs.date }}-golden-questions/report.md" \
            --json-output "docs/evidence/graph-agent-lite/${{ steps.date.outputs.date }}-golden-questions/report.json"

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-questions-${{ steps.date.outputs.date }}
          path: docs/evidence/graph-agent-lite/${{ steps.date.outputs.date }}-golden-questions/
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Golden Questions Evaluation — ${{ steps.date.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Suite filter: \`${{ github.event.inputs.suite }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: \`${{ github.event.inputs.mode }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "OPENROUTER_API_KEY secret present: ${{ secrets.OPENROUTER_API_KEY != '' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event.inputs.mode }}" = "live" ]; then
            echo "Live mode: scored report archived as artifact. Pass requires every suite to pass; failure exited non-zero. Per runbook §4.5, on PASS commit the report under docs/evidence/graph-agent-lite/<date>-golden-questions/ and flip the relevant status doc row." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry-run mode: inventory-only report archived. Re-run with mode=live + the four GOLDEN_Q_LIVE_* inputs to score against the seeded suites." >> "$GITHUB_STEP_SUMMARY"
          fi
