name: Governance Validation

on:
  pull_request:
    paths:
      - "Template/Shell/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install ajv
      - run: node scripts/validate-schemas.mjs
      - run: node Template/Shell/tools/update-registry-checksums.mjs
