# Native Graph Workspace MVP 0 — Phase 1.5 G3 backend decision gate.
#
# Operator-triggered execution of the Neo4j CE benchmark runbook at
# docs/runbooks/agent-studio-native-graph-workspace-neo4j-ce-benchmark-runbook.md
#
# The runbook §9 prohibits this from running on every PR (it is
# resource-intensive and meaningless without a real fixture). This
# workflow is `workflow_dispatch` only — the operator triggers it
# from the Actions tab or via `gh workflow run`.
#
# Outputs:
#   - GitHub Actions artifact: graph-bench-report-${run_id}.zip containing
#     the markdown report under docs/evidence/graph-backend/${date}-neo4j-ce/
#   - Exit 0 on overall pass / 1 on fail (per `run-benchmark.ts:91`)
#
# Closure path (runbook §7):
#   - On pass: operator commits the evidence directory + updates the
#     `agent-studio-active-graph-backend-decision.md` ADR Status to
#     "Adopted (validated)".
#   - On fail: operator files a `-rev-${date}.md` ADR per runbook §8.

name: Graph Backend Benchmark — Neo4j CE (G3)

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Comma-separated scenario keys (or "all")'
        required: false
        default: 'all'
      iterations:
        description: 'Iterations per scenario'
        required: false
        default: '30'
      fixture_scale:
        description: 'Fixture size (sanity = 100 notes / 1k links / 500 nodes / 2.5k edges; full = runbook spec)'
        required: false
        default: 'sanity'
        type: choice
        options:
          - sanity
          - full
      include_postgres_baseline:
        description: 'Also run the Postgres-backed baseline for comparison'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  bench:
    runs-on: ubuntu-latest
    # The full-scale fixture (50k upserts + 250k edges) is operator
    # territory and will easily exceed 60 minutes on a hosted runner.
    # The sanity scale completes in well under 30 minutes. Operator
    # is expected to pick a self-hosted runner for full scale.
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: asdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/devpassword
          # Accept the license terms for Community Edition (no-op
          # under CE but kept for ADR-traceability when Aura is
          # evaluated per Phase 27).
          NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/asdb
      DATABASE_URL_ASDB: postgres://testuser:testpass@localhost:5432/asdb
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: devpassword

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply ASDB schema
        run: npx drizzle-kit push --force

      - name: Wait for Neo4j health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7474 > /dev/null; then
              echo "[wait] Neo4j ready after ${i} polls"
              exit 0
            fi
            sleep 5
          done
          echo "[wait] Neo4j did not become healthy" >&2
          exit 1

      - name: Compute run date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Resolve fixture scale
        id: scale
        run: |
          if [ "${{ github.event.inputs.fixture_scale }}" = "full" ]; then
            echo "label=full" >> "$GITHUB_OUTPUT"
          else
            echo "label=sanity" >> "$GITHUB_OUTPUT"
          fi
          echo "[scale] using ${{ github.event.inputs.fixture_scale }} fixture"

      - name: Postgres baseline benchmark
        if: ${{ github.event.inputs.include_postgres_baseline == 'true' }}
        env:
          GRAPH_BACKEND: postgres
        run: |
          mkdir -p "docs/evidence/graph-backend/${{ steps.date.outputs.date }}-postgres-baseline-${{ steps.scale.outputs.label }}"
          npx tsx scripts/graph-bench/run-benchmark.ts \
            --scenarios "${{ github.event.inputs.scenarios }}" \
            --iterations "${{ github.event.inputs.iterations }}" \
            --output "docs/evidence/graph-backend/${{ steps.date.outputs.date }}-postgres-baseline-${{ steps.scale.outputs.label }}/report.md"

      - name: Neo4j CE benchmark
        env:
          GRAPH_BACKEND: neo4j-ce
        run: |
          mkdir -p "docs/evidence/graph-backend/${{ steps.date.outputs.date }}-neo4j-ce-${{ steps.scale.outputs.label }}"
          # The Postgres baseline already populated ASDB fixture rows
          # (if requested). Skip fixture generation on the Neo4j run
          # so projection sync (when wired) can replay the same
          # fixture without doubling node counts. Without baseline,
          # generate fresh.
          if [ "${{ github.event.inputs.include_postgres_baseline }}" = "true" ]; then
            SKIP_FLAG="--skip-fixture"
          else
            SKIP_FLAG=""
          fi
          npx tsx scripts/graph-bench/run-benchmark.ts \
            --scenarios "${{ github.event.inputs.scenarios }}" \
            --iterations "${{ github.event.inputs.iterations }}" \
            $SKIP_FLAG \
            --output "docs/evidence/graph-backend/${{ steps.date.outputs.date }}-neo4j-ce-${{ steps.scale.outputs.label }}/report.md"

      - name: Assert Postgres source-of-truth invariant
        run: |
          # CLAUDE.md "Native Graph Workspace — Non-Build List" hard rule:
          # Postgres = source of truth; Neo4j CE = projected backend.
          # After the run, the ASDB fixture tables MUST still contain
          # the expected node + edge counts. If Postgres rows are
          # missing or smaller than the Neo4j projection, an invariant
          # has been violated.
          NOTES=$(psql "${DATABASE_URL_ASDB}" -tAc "SELECT count(*) FROM ags_vault_notes" 2>/dev/null || echo 0)
          NODES=$(psql "${DATABASE_URL_ASDB}" -tAc "SELECT count(*) FROM ags_graph_nodes" 2>/dev/null || echo 0)
          EDGES=$(psql "${DATABASE_URL_ASDB}" -tAc "SELECT count(*) FROM ags_graph_edges" 2>/dev/null || echo 0)
          echo "[postgres-sot] notes=${NOTES} nodes=${NODES} edges=${EDGES}"
          if [ "${NOTES}" -eq 0 ] && [ "${NODES}" -eq 0 ] && [ "${EDGES}" -eq 0 ]; then
            echo "::error::Postgres source-of-truth assertion failed — ASDB has zero notes/nodes/edges after the benchmark run. Either fixture generation never executed (Neo4j-only path?) or the run mutated Neo4j without populating Postgres first."
            exit 1
          fi
          echo "[postgres-sot] OK — ASDB retains the fixture rows after Neo4j benchmark."

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-bench-${{ steps.date.outputs.date }}-${{ steps.scale.outputs.label }}
          path: docs/evidence/graph-backend/${{ steps.date.outputs.date }}-*/
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Graph Backend Benchmark — ${{ steps.date.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Scale: \`${{ steps.scale.outputs.label }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Scenarios: \`${{ github.event.inputs.scenarios }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Iterations: ${{ github.event.inputs.iterations }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "On pass: follow runbook §7 to commit evidence and flip G3 to 'Closed (validated)'." >> "$GITHUB_STEP_SUMMARY"
          echo "On fail: follow runbook §8 to file the rev-ADR." >> "$GITHUB_STEP_SUMMARY"
