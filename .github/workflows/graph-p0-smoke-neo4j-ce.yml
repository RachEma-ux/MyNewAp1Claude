# P0 / MVP 4 closure live smoke for Neo4j CE.
#
# Operator-triggered. Stands up a real Neo4j 5 CE service container,
# seeds a synthetic 50-node chain via the production projection
# writer, then exercises every P0 closure surface (traversal,
# permission, explain, capability-gated algorithm). Evidence lands
# under `docs/evidence/graph-backend/<date>-neo4j-ce-p0-smoke/` as
# both `report.md` and `report.json`.
#
# Exit codes from `run-neo4j-ce-p0-smoke.ts`:
#   - 0  → all scenarios passed
#   - 1  → at least one scenario failed (FAIL — do not mark closure)
#   - 2  → unhandled error in the smoke runner
#   - 78 → skip (NEO4J_PASSWORD not set; should not happen in this workflow)
#
# Honest skip-safe: the runner refuses to start without a real
# password. No false PASS when Neo4j is unavailable.

name: Graph P0 Closure Smoke — Neo4j CE

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per scenario (default 10)'
        required: false
        default: '10'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/devpassword
          NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 10

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: devpassword
      NEO4J_DATABASE: neo4j
      SMOKE_ITERATIONS: ${{ github.event.inputs.iterations }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Wait for Neo4j health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7474 > /dev/null; then
              echo "[wait] Neo4j ready after ${i} polls"
              exit 0
            fi
            sleep 5
          done
          echo "[wait] Neo4j did not become healthy" >&2
          exit 1

      - name: Run P0 smoke
        run: |
          npx tsx scripts/graph-bench/run-neo4j-ce-p0-smoke.ts

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-p0-smoke-${{ github.run_id }}
          path: docs/evidence/graph-backend/
          if-no-files-found: warn
          retention-days: 90
