name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Test path pattern (e.g. server/workspace/seed/)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply database schema
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb

      # ── Layer 1: Contract Tests ───────────────────────────────────────
      # Domain, Catalog, and Runtime contract validation.
      - name: Contract tests (Layer 1)
        run: npx vitest run tests/contracts/ --reporter=verbose
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb

      # ── Layer 2: Governance Tests ───────────────────────────────────
      # Policy blocking, audit enforcement, invalid transition detection.
      - name: Governance tests (Layer 2)
        run: npx vitest run tests/governance/ --reporter=verbose
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb

      # ── Layer 3: Integration Tests — Scenarios ─────────────────────
      # 7 real-world scenarios with step-by-step invariant checks.
      # TEST_MODE=staging-integration lifts the vitest config exclude
      # for tests/integration/** added in the test-mode separation PR.
      - name: Scenario tests (Layer 3a)
        run: npx vitest run tests/integration/ai-types/ --reporter=verbose
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
          TEST_MODE: staging-integration

      # ── Layer 3: Integration Tests — DB Integrity ──────────────────
      # FK integrity, fallback, dedup, state constraints, availability.
      - name: DB integrity tests (Layer 3b)
        run: npx vitest run tests/integration/runtime-db/ --reporter=verbose
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
          TEST_MODE: staging-integration

      # ── Layer 4: UI Selector Tests ─────────────────────────────────
      # Intake selectors, app selectors, chat selectors, bot wizard.
      - name: UI selector tests (Layer 4)
        run: npx vitest run tests/ui/ --reporter=verbose
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb

      # ── Layer 5: PMB Unit Tests (Phase 30.4 + Phase 33) ────────────
      # Targeted curated subset of `server/**/*.test.ts` covering the
      # Provider/Model Binding contract surface. NOT the whole
      # `server/**` tree (147 files; most aren't PMB-relevant).
      # Per the project's standing OOM-safe pattern (CLAUDE.md):
      # `--pool=forks --poolOptions.forks.singleFork`.
      #
      # Files covered:
      #   - workspace-default-bindings.test.ts (Phase 29.1b)
      #   - embeddings/service.test.ts (Phase 29.4b)
      #   - operators/provider-hub.test.ts (Phase 29.5)
      #   - openrouter/manifest-receipt-policy.test.ts (Phase 20 + 29.4a)
      #   - openrouter/model-access/run-via-openllm-bridge.test.ts (Phase 28.6b)
      #   - openrouter/model-access/embed.test.ts (Phase 28.4)
      #   - providers/pricing.test.ts (Phase 30.2)
      #   - agent-studio/services/chat-binding.test.ts (Phase 33 —
      #     was deferred since Phase 28; tool-loop tests fixed by
      #     adding D-TOOL-1 `riskClass: "read_only"` to the test mock)
      - name: PMB unit tests (Layer 5)
        run: |
          npx vitest run \
            server/agent-studio/workspace-default-bindings.test.ts \
            server/agent-studio/services/chat-binding.test.ts \
            server/embeddings/service.test.ts \
            server/operators/provider-hub.test.ts \
            server/openrouter/manifest-receipt-policy.test.ts \
            server/openrouter/model-access/run-via-openllm-bridge.test.ts \
            server/openrouter/model-access/embed.test.ts \
            server/providers/pricing.test.ts \
            --pool=forks --poolOptions.forks.singleFork --reporter=verbose

      # ── Layer 6: Retrofit Acceptance Suite ─────────────────────────
      # Locked contract for the Agent Studio retrofit per
      # `docs/implementation/agent-studio-retrofit-acceptance.md` §3.2.
      # Covers D-NKU-3/4, D-RAC-PLANNER (full 8-mode lattice),
      # D-PTC-2 (every gate), D-APP-EXT-2/4/5, D-PTC-4, trace
      # assembly, D-UI-5 + §D4 (11 parsers), D-RET-1 (7 source
      # types), D-CAG-RECON-2/3/4/5, D-TOOL-1 (8 classes), §D2
      # single-region.
      #
      # Pure-surface tests (no DB, no mocks, no DATABASE_URL).
      # singleFork per CLAUDE.md OOM-safe pattern. A failure here
      # points directly at which decision-rule lattice broke.
      - name: Retrofit acceptance suite (Layer 6)
        run: npx vitest run tests/agent-studio/retrofit-acceptance.test.ts --pool=forks --poolOptions.forks.singleFork --reporter=verbose

      # ── Layer 7: PMB invariant suites ──────────────────────────────
      # Plan v3 Phase 42 (boundary), Phase 43 (gateway-action wiring),
      # Phase 44 (runtime-coverage attestation). Pure source-string
      # static scans — no DB, no network. Companion to the D1/D2
      # boundary scripts below: scripts catch raw `process.env` /
      # credential-resolver-import violations; these tests catch the
      # higher-level Plan v3 invariants (action keys wired, coverage
      # files present, AS does not write catalog_entries, etc.).
      - name: PMB invariant suites (Layer 7)
        run: npx vitest run tests/pmb/ --pool=forks --poolOptions.forks.singleFork --reporter=verbose

      # ── Layer 8: Runtime Hardening Safety Subset ───────────────────
      # Roadmap V3 Phase 2 (closure for Definition-of-Done Gate 2).
      # Per the Phase 1d audit findings (`docs/evidence/runtime-hardening/
      # 2026-05-10-phase-1/04-test-and-ci-coverage.md`), the V1 audit's
      # hypothesis that retrofit acceptance was outside default CI was
      # falsified — Layer 6 above already runs it. The actual Phase-2
      # gap was the safety-critical UNIT subset never running on PR.
      # 84 tests under tests/agent-studio/ exist; only 1 (retrofit
      # acceptance) ran on PR before this layer.
      #
      # Categories closed by this layer:
      #  - ProposedToolCall validation (8-gate failure locality)
      #  - Approval gate state machine + TTL math
      #  - Sandbox gate (timeout, deny-global, frozen-intrinsic, UNAVAILABLE)
      #  - MCP dispatcher (timeout sentinel, error sanitization,
      #    output-schema validation, sandbox-error mapping)
      #  - Trace-row builders (pure-functional)
      #  - CAG boundary classifier
      #  - Canonical serializer determinism
      #  - chat-stream tool-loop guards (h6-c7, h7-c7)
      #  - Full MCP dispatcher unit suite (mocked, no DB)
      #  - OpenRouter Model Access execute path
      #  - Permission default behavior (NEW — closes Phase 1e M4)
      #
      # All files are pure-surface (no DB, no network). singleFork per
      # the standing OOM-safe pattern from Layer 5/6/7. Estimated added
      # wall time: 8–15 s per Phase 1d §5.
      - name: Runtime hardening safety subset (Layer 8)
        run: |
          npx vitest run \
            tests/agent-studio/proposed-tool-call.test.ts \
            tests/agent-studio/approval-gate.test.ts \
            tests/agent-studio/sandbox-gate.test.ts \
            tests/agent-studio/dispatcher-tool-call-timeout.test.ts \
            tests/agent-studio/dispatcher-error-sanitization.test.ts \
            tests/agent-studio/sanitize-mcp-error-message.test.ts \
            tests/agent-studio/dispatcher-output-schema-validation.test.ts \
            tests/agent-studio/dispatcher-sandbox-error-mapping.test.ts \
            tests/agent-studio/runtime-trace-writer.test.ts \
            tests/agent-studio/rac-trace.test.ts \
            tests/agent-studio/cag-boundaries.test.ts \
            tests/agent-studio/canonical-determinism.test.ts \
            tests/agent-studio/h6-c7-client-awaiting-handler.test.ts \
            tests/agent-studio/h7-c7-loop-reentrancy-guard.test.ts \
            tests/agent-studio/permission-default.test.ts \
            tests/agent-studio/sse-heartbeat.test.ts \
            tests/agent-studio/client-message-id-idempotency.test.ts \
            server/agent-studio/services/mcp/__tests__/dispatcher.test.ts \
            server/openrouter/model-access/execute.test.ts \
            --pool=forks --poolOptions.forks.singleFork --reporter=verbose

      # ── Static Governance Guard ─────────────────────────────────────
      # Scans source code for forbidden patterns that violate governance invariants.
      - name: Static governance invariant scan
        run: npx tsx scripts/governance/check-invariants.ts

      # ── Plan v3 Provider/Model Binding boundary scans (R4) ─────────
      # D1 (env-key) + D2 (credential-resolver import) static enforcement.
      # The PMB cleanup arc (§28-§41) closed every D1/D2 violation on
      # main; these scripts are the regression guard. Wired here per
      # the 2026-05-08 RAC audit finding G4: scripts existed and had
      # `npm run check:*` shortcuts, but were not invoked by any CI
      # workflow, leaving the boundary unenforced on PR merges.
      - name: Provider credential resolver boundary (D2)
        run: npx tsx scripts/check-provider-credential-resolver-boundary.ts

      - name: Provider env-key boundary (D1)
        run: npx tsx scripts/check-provider-key-env-boundary.ts

      # ── Additional Tests (manual trigger) ───────────────────────────
      - name: Run additional tests
        if: ${{ github.event.inputs.test_path != '' }}
        run: npx vitest run ${{ github.event.inputs.test_path }} --reporter=verbose
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
