# Project Context Translator — Catalog Import File (YAML)
# Upload via Import Catalog Entries → File Import
#
# This agent transforms unstructured user input into structured
# PS Ideation fields and a PS Wizard-ready scenario package.
#
# The config.runtime block follows ServiceRuntimeConfig so the
# catalog resolver can health-check, invoke, and configure the service.

- name: ps.agent.context_translator
  displayName: "Project Context Translator"
  entryType: agent
  description: "Transforms unstructured user input into structured PS Ideation fields and a PS Wizard-ready scenario package. Applies the formula: Project Context = External Drivers + Internal Drivers + Trigger."
  category: specialist
  subCategory: ideation
  tags:
    - ps
    - ideation
    - context-translator
    - wizard
    - scenario
    - llm-powered
  capabilities:
    - translate
    - ideation
    - scenario-generation
  scope: app
  config:
    version: "1.0.0"
    agentType: context_translator
    runtime:
      kind: service
      serviceKind: python
      serviceName: project-context-translator
      serviceUrlEnv: PROJECT_CONTEXT_TRANSLATOR_URL
      serviceUrlDefault: "http://localhost:8585"
      healthEndpoint: /health
      statusEndpoint: /status
      translateEndpoint: /translate
      inputSchemaRef: "shared/ps-context-translator-types#TranslateRequest"
      outputSchemaRef: "shared/ps-context-translator-types#TranslateResponse"
      capabilityTags:
        - ps-ideation
        - wizard-handoff
        - context-framing
      bounded: true
    formula: "Project Context = External Drivers + Internal Drivers + Trigger"
    llmProviders:
      - openai
      - anthropic
    envVars:
      - PCT_LLM_PROVIDER
      - PCT_LLM_API_KEY
      - PCT_LLM_MODEL
      - PCT_LLM_BASE_URL
      - PCT_LLM_MAX_TOKENS
    defaultEnv:
      PCT_LLM_PROVIDER: openai
      PCT_LLM_MODEL: gpt-4o-mini
      PCT_LLM_BASE_URL: "https://api.openai.com/v1"
      PCT_LLM_MAX_TOKENS: "4096"
