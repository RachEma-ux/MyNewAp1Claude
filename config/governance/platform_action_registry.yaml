  # If a future PMT governance-flow PR wires these gates, it should add the
  # action defs alongside the action-key-map entries (as cycle-2's R2-c2
  # pattern shows). The cycle-3 R10-c3 finding (R1/R2 evidence required is
  # silently skipped at runtime) made this cleanup more useful: 2 of the 8
  # removed entries (submitForIntake R2 + change.create R2) had `evidence:
  # required: true` that the runtime would have skipped anyway.

