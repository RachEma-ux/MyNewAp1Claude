# Platform Action Registry — Unified Governance v1
# Global risk-adaptive governance: every mutation in the system mapped here.
# Unknown action keys → deny-by-default at runtime.

version: 1

# ─── Risk Model ─────────────────────────────────────────────────────────────
# R1 – Local reversible (no governance evaluation)
# R2 – Scoped impact (no governance evaluation)
# R3 – Cross-boundary / partial irreversible (GovernanceCenter.evaluate)
# R4 – External boundary / privilege escalation (evaluate + approval)
# R5 – Platform integrity (evaluate + dual_control + evidence)

governance_threshold: R3

# ─── Approval Rules ─────────────────────────────────────────────────────────
# none          – no approval needed
# role_any      – any user with required capability
# role_all      – all users with required capability must approve
# dual_control  – two distinct principals must approve
# conditional   – approval required only when conditions met

# ─── Evidence Types ─────────────────────────────────────────────────────────
# diff, reason, sources, plan, tool_intents, payload_hash,
# probe_results, tests_passed, signed_commit

# ─── Actions ────────────────────────────────────────────────────────────────

