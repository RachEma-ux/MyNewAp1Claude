  # RAC Phase 1D — operator-triggered Capability Pack rebuild for an
  # Agent Studio draft. Writes one row to `ags_cag_capability_packs`
  # only when the source manifest hash drifted (idempotent on match);
  # appendPackEvent emits an audit row either way. R2 because the blast
  # radius is a single agent draft and the pack carries no credential
  # material (validator rejects FORBIDDEN_BINDING_KEYS-shaped fields).
  agentStudio.cag.refreshPack:
    domain: agent
    risk: R2
    capability: agent.manage
    stage: mutate
    approval: none
    evidence: { required: false }

  # U5-b.4 — operator override of a knowledge unit's license tag.
  # Affects retrieval-time license enforcement: re-tagging a unit from
  # `GPL-3.0-or-later` to `MIT` would unblock retrieval under a profile
  # whose `licenseBlocklist` carries `GPL-3.0-or-later`. R2 because the
  # blast radius is one unit per call and the change is reversible by
  # re-running the mutation. Same shape as `knowledge.document.delete`
  # — operator override on a single knowledge row.
  agentStudio.kb.setLicense:
    domain: knowledge
    risk: R2
    capability: knowledge.manage
    stage: mutate
    approval: none
    evidence: { required: false }

  # U5-b.4 — operator false-positive override for PII findings on a
  # knowledge unit. Per ADR DD7 the validation audit trail
  # (`ags_data_validation_results`) stays immutable; only the unit-row
  # projection is cleared, and `validationStatus` is recomputed from
  # the remaining non-PII findings. R2 because clearing PII can unblock
  # retrieval of content that was previously gated.
  agentStudio.kb.clearPiiFindings:
    domain: knowledge
    risk: R2
    capability: knowledge.manage
    stage: mutate
    approval: none
    evidence: { required: false }

  # ─────────────────────────────────────────────────────────────────
  # R2-c2 — pre-existing damage discovered by the systemic
  # governance-coverage audit. The 9 entries below were all declared as
  # `governedProcedure` in their routers but never registered, so every
  # call returned HTTP 403 (deny-by-default). Same conservative shape
  # as `agentStudio.cag.refreshPack` — registers them at R2 / agent.manage /
  # approval:none / no evidence so the deny path no longer fires.
  # Risk-tiering can be tightened per-action via separate follow-ups if
  # any specific procedure warrants stricter approval/evidence policy.
  # ─────────────────────────────────────────────────────────────────

  # MCP schema drift sync — operator-triggered re-fetch of MCP server
