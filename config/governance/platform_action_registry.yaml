  # gate.evaluate, gate.waive, change.create, change.submit). They were declared
  # under a "# PMT Lifecycle Governance" header but had no entry in
  # `server/governance/action-key-map.ts` pointing at them, so no tRPC
  # procedure could resolve to them. Aspirational governance gates that
  # were never wired up.
