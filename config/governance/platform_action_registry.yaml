  agentStudio.mcpSchemaSync.sync:
    domain: agent
    risk: R2
    capability: agent.manage
    stage: mutate
    approval: none
    evidence: { required: false }

  # Operator's approve/deny decision on a pending tool-call approval
  # request. The decision is the gate itself — requiring approval to
  # decide an approval would be circular. R2 because the action is
  # logged (the gate's audit trail is the evidence path); blast radius
  # is one pending request per call.
  agentStudio.toolApprovals.decide:
    domain: agent
    risk: R2
    capability: agent.manage
    stage: mutate
    approval: none
    evidence: { required: false }

  # C1-c4 — Publish-workflow approval decision. Companion to
  # toolApprovals.decide: same shape, different surface (publish step
  # lifecycle, not MCP tool-call hash). The decision IS the gate, so
  # approval: none (mirrors toolApprovals reasoning). R2 because the
  # decision writes a LIFECYCLE_TRANSITION audit row + idempotent on
  # step state (already-decided steps return CONFLICT before any write).
  agentStudio.publish.decideApproval:
    domain: agent
    risk: R2
    capability: agent.manage
    stage: mutate
    approval: none
    evidence: { required: false }

